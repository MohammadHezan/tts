org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Lets `gradle :core:test` build/test the pure-Kotlin core module without
# configuring :app (and thus without needing the Android SDK) - see
# android/README.md "Building" for why the two modules are split this way.
org.gradle.configureondemand=true
