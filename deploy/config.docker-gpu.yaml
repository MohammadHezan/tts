# GPU variant of config.docker.yaml, used by docker-compose.gpu.yml (the start
# scripts switch to it when Docker can use an NVIDIA GPU). Differences: speech
# recognition by Cohere Transcribe Arabic on the GPU (asr.cohere below), the
# translation model (Gemma 3 12B) on the GPU too. Otherwise identical; the
# original notes below still apply:
#
# Translator config for docker-compose.yml. Same schema as the repo-root
# config.yaml, adjusted for running in a container with no GPU:
#   - ASR on CPU with a smaller Whisper model (large-v3-turbo on CPU can't keep
#     up with a live meeting - see README "Hardware")
#   - Ollama reached at the compose service name, not localhost
#   - TTS on, since a meeting bot that can't speak is only half useful; the
#     voice files are mounted at /models (see docker-compose.yml)

audio:
  sample_rate_hz: 16000
  frame_ms: 30
  channels: 1

vad:
  # Tuned for call audio, which is mostly silence and comfort noise: a
  # phantom sentence (Whisper hearing "شكراً" in noise) costs more than a
  # missed "mm".
  provider: silero
  threshold: 0.6
  min_speech_ms: 250 # still catches a short "yes" / "نعم"
  min_silence_ms: 500 # a sentence ends 0.5s after the speaker stops
  speech_pad_ms: 200
  min_utterance_dbfs: -50 # quieter than this is noise, not someone talking
  min_voiced_ms: 45 # breaths/clicks/keyboard have no voice pitch at all; a one-word "yes" has 60+ms
  # Phrase by phrase, like a live interpreter: after 3.5s of talking (about 10
  # words) the next short pause hands that phrase on to be translated and
  # spoken while the speaker carries on. Remove phrase_min_ms to wait for
  # whole sentences instead.
  phrase_min_ms: 3500
  phrase_pause_ms: 200 # a comma-length pause (quieter than speech - see vad.py)
  phrase_max_ms: 8000 # no pause by then: cut at the quietest moment

asr:
  # Cohere Transcribe Arabic, dialect fine-tune: on real Jordanian speech 26%
  # word / 6.6% character errors vs 44% / 15% for Whisper large-v3-turbo, as
  # good at English, faster. Each phrase is transcribed as Arabic and as
  # English, and the one the model is surest of wins (99.3% right on short
  # phrases). If it can't load, Whisper large-v3-turbo (below) takes over.
  provider: cohere
  cohere:
    model: oddadmix/cohere-transcribe-arabic-07-2026-dialectal-v2 # Apache-2.0
    revision: e6a73c8baa7edcd43dd562110cabca40e79d8041
    processor: Newmetrics/cohere-transcribe-arabic-07-2026 # Apache-2.0 copy of CohereLabs' (gated) repo
    processor_revision: 35dbaf071fb0eec23ae1fdcbf671d469bc607e5c
    cache_dir: /models/asr # the interpreter-asr volume, filled once by asr-pull
    quantize: int8 # 2.4GB of video memory instead of 4.3GB, same accuracy
  model: large-v3-turbo
  device: cuda
  compute_type: int8_float16
  cpu_fallback_model: small # if the GPU can't run it after all: the CPU setup's model
  language: auto
  candidate_languages: [en, ar] # auto-detect picks between these two only
  glossary_path: glossary.yaml # its terms become Whisper hint words ("walnut", not "wall at")
  beam_size: 1
  local_agreement:
    enabled: true
    chunk_ms: 500
    agreement_window: 2

translator:
  provider: ollama
  source_lang: en
  target_lang: ar
  domain_prompt: retail_furniture
  context_turns: 6
  glossary_path: glossary.yaml
  ollama:
    base_url: http://ollama:11434
    # Gemma 3 12B: clearly better Arabic than Llama 3.1 8B in the meeting
    # simulation ("كرسي طعام", not "كرسيًا طعامًا"), and on par with Google's
    # TranslateGemma 12B, which added things nobody said. IQ4_XS, the compact
    # 4-bit build: 7.1GB of video memory instead of 7.8GB, translations just as
    # good - so it fits a 12GB card beside the speech model with room to spare
    # (with 7.8GB the card overflowed and every step got several times slower).
    # Too slow for the CPU config.
    model: hf.co/unsloth/gemma-3-12b-it-GGUF:IQ4_XS
    num_ctx: 4096
    timeout_s: 60 # the first request also loads the model into video memory
  claude:
    model: claude-haiku-4-5-20251001
    timeout_s: 15
    max_tokens: 512

tts:
  # Microsoft's neural voices (online, no key) - natural Arabic and English at
  # a conversational pace. The local voices below speak any sentence they
  # can't deliver (no internet, service down).
  provider: neural
  sample_rate_hz: 24000
  neural:
    voices:
      en: en-US-AndrewNeural
      ar: ar-JO-TaimNeural
    rates: # relative to the voice's own pace: "-10%" slower, "+10%" faster
      en: "-5%"
      ar: "+0%"
    timeout_s: 6.0
  kokoro:
    model_path: /models/kokoro-v1.0.onnx
    voices_path: /models/voices-v1.0.bin
    voice: af_heart
    lang: en-us
    speed: 0.85   # 1.0 is ~190 words/min - too fast to follow
  piper:
    model_path: /models/ar_JO-kareem-medium.onnx
    config_path: null
    length_scale: 1.05

logging:
  level: INFO
  structured: true
  latency_metrics: true
