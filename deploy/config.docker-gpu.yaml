# GPU variant of config.docker.yaml, used by docker-compose.gpu.yml (the start
# scripts switch to it when Docker can use an NVIDIA GPU). Differences: speech
# recognition by Cohere Transcribe Arabic on the GPU (asr.cohere below), the
# translation model (Gemma 3 4B) on the GPU too. Otherwise identical; the
# original notes below still apply:
#
# Translator config for docker-compose.yml. Same schema as the repo-root
# config.yaml, adjusted for running in a container with no GPU:
#   - ASR on CPU with a smaller Whisper model (large-v3-turbo on CPU can't keep
#     up with a live meeting - see README "Hardware")
#   - Ollama reached at the compose service name, not localhost
#   - TTS on, since a meeting bot that can't speak is only half useful; the
#     voice files are mounted at /models (see docker-compose.yml)

audio:
  sample_rate_hz: 16000
  frame_ms: 30
  channels: 1

vad:
  # Tuned for call audio, which is mostly silence and comfort noise: a
  # phantom sentence (Whisper hearing "شكراً" in noise) costs more than a
  # missed "mm".
  provider: silero
  threshold: 0.6
  min_speech_ms: 250 # still catches a short "yes" / "نعم"
  min_silence_ms: 500 # a sentence ends 0.5s after the speaker stops
  speech_pad_ms: 200
  min_utterance_dbfs: -50 # quieter than this is noise, not someone talking
  min_voiced_ms: 45 # breaths/clicks/keyboard have no voice pitch at all; a one-word "yes" has 60+ms
  # Phrase by phrase, like a live interpreter: after 3.5s of talking (about 10
  # words) the next short pause hands that phrase on to be translated and
  # spoken while the speaker carries on. Remove phrase_min_ms to wait for
  # whole sentences instead.
  phrase_min_ms: 3500
  phrase_pause_ms: 200 # a comma-length pause (quieter than speech - see vad.py)
  phrase_max_ms: 8000 # no pause by then: cut at the quietest moment

asr:
  # Cohere Transcribe 03-2026 (the base model), on the GPU. Measured on the
  # RTX 3060 against Whisper large-v3-turbo and the community dialect
  # fine-tune with engine/test_asr_voices.py (36 clips, 12 voices, 11 sound
  # conditions): word errors 14% vs 22% vs 21%; Arabic 11.9% vs 25.1% vs 24.2%;
  # a phrase takes 0.45-0.75s. Each phrase is transcribed as Arabic and as
  # English and the one the model is surest of wins. The model is gated
  # (accept its terms on huggingface.co, download it once) and is mounted
  # from ./local-models - see docker-compose.gpu.yml. If it can't load,
  # Whisper large-v3-turbo (below) takes over.
  provider: cohere
  cohere:
    model: /local-models/cohere-transcribe-03-2026
    processor: null # the model's own folder has its processor
    trust_remote_code: false # transformers 5 has the model built in
    quantize: none # 4.3GB of video memory
  model: large-v3-turbo
  device: cuda
  compute_type: int8_float16
  cpu_fallback_model: small # if the GPU can't run it after all: the CPU setup's model
  language: auto
  candidate_languages: [en, ar] # auto-detect picks between these two only
  glossary_path: glossary.yaml # its terms become Whisper hint words ("walnut", not "wall at")
  beam_size: 1
  local_agreement:
    enabled: true
    chunk_ms: 500
    agreement_window: 2

translator:
  provider: ollama
  source_lang: en
  target_lang: ar
  domain_prompt: retail_furniture
  context_turns: 6
  glossary_path: glossary.yaml
  ollama:
    base_url: http://ollama:11434
    # Gemma 3 4B text-only + our Arabic<->English LoRA (training/), merged,
    # Q4_K_M, vocabulary cut to English+Arabic (deploy/prune_model.py): 2.0GB,
    # about 115 tokens/s on the RTX 3060, 96% of the 44-case benchmark
    # (engine/test_translator_model.py) against 93% for the same model without
    # the LoRA. docker-compose.gpu.yml builds it from ./local-models.
    model: gemma3-4b-lora-aggr
    num_ctx: 4096
    timeout_s: 60 # the first request also loads the model into video memory
  claude:
    model: claude-haiku-4-5-20251001
    timeout_s: 15
    max_tokens: 512

tts:
  # All local, nothing online to be refused or time out: English by Kokoro
  # (0.7-1.2s a sentence), Arabic by Piper (Jordanian "kareem", 0.5-0.9s). In our
  # read-back test both were as clear as Microsoft's online voices
  # (engine/test_tts_models.py). To use Microsoft's online voices again:
  # provider: neural, with tts.neural.voices (the local ones are then its fallback).
  provider: multi_voice
  sample_rate_hz: 24000
  neural:
    voices:
      ar: ar-LB-RamiNeural
    rates:
      ar: "-5%"
    timeout_s: 6.0
  kokoro:
    model_path: /models/kokoro-v1.0.onnx
    voices_path: /models/voices-v1.0.bin
    voice: af_heart
    lang: en-us
    speed: 0.85   # 1.0 is ~190 words/min - too fast to follow
  piper:
    model_path: /models/ar_JO-kareem-medium.onnx
    config_path: null
    length_scale: 0.8 # measured 1.20x faster than the old 1.05 (a duration multiplier: smaller = faster)

meeting:
  record_dir: /srv/meetings # the sentences of each meeting, saved on this PC (the meeting-data folder)
  utc_offset_minutes: 180 # times in the summary document: Jordan
  # What the bot does in each meeting until the dashboard buttons change it.
  voice: true # speak the translations; off = no voice is synthesized at all
  chat_text: both # typed in the meeting chat: what was said, then its translation (off | translation | both)
  hold_voice: true # the voice is made while someone talks and spoken once they stop
  hold_release_ms: 300 # quiet this long after the last word before it speaks
  hold_max_s: 30 # someone who talks on this long without a real pause is interpreted anyway

logging:
  level: INFO
  structured: true
  latency_metrics: true
