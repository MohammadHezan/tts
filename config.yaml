# Arabic <-> English real-time speech translation - shared pipeline configuration.
#
# Every stage (ASR / Translator / TTS) is selected here by "provider" name and
# instantiated through engine/app/providers/base.py factories. Swap local <-> cloud
# without touching pipeline code. No secrets live here - see .env.example.
#
# Phase 2: bidirectional EN<->AR (ASR auto-detects the spoken language; the
# translator/TTS direction follows automatically) with audio output, glossary,
# and multi-turn context memory. See README "Setup" for the model downloads
# tts.* needs (not bundled - same story as asr.model in Phase 1).

audio:
  sample_rate_hz: 16000
  frame_ms: 30 # capture frame size streamed over the WS, per HARD CONSTRAINTS (20-30ms)
  channels: 1

vad:
  provider: silero
  threshold: 0.5 # speech probability threshold (0-1)
  min_speech_ms: 150 # ignore blips shorter than this
  min_silence_ms: 700 # trailing silence that ends/endpoints an utterance
  speech_pad_ms: 200 # padding kept around detected speech edges

asr:
  provider: cohere
  cohere:
    model: /path/to/cohere-transcribe-03-2026
    processor: null
    trust_remote_code: true
    quantize: none

translator:
  provider: ollama # ollama (local, default) | claude (cloud)
  # The two languages in play; Pipeline picks translation direction per turn
  # from whichever one ASR did NOT detect as the source (see app/pipeline.py).
  source_lang: en
  target_lang: ar
  domain_prompt: retail_furniture
  context_turns: 6 # rolling window of prior turns fed back to the LLM for consistency
  glossary_path: glossary.yaml # repo-root-relative; null disables
  ollama:
    base_url: http://localhost:11434
    model: hf.co/innerloop-dev/gemma3-4b-text:Q4_K_M  # Gemma 3 4B, text-only (see deploy/config.docker-gpu.yaml)
    timeout_s: 15

tts:
  # "none" ships safe-by-default (no model downloads required to run captions-only).
  # Set to "multi_voice" once you've downloaded the Kokoro + Piper weights below.
  provider: none # none | multi_voice | fake
  sample_rate_hz: 24000 # informational - AUDIO events carry their own actual sample rate
  kokoro: # English voice - Apache-2.0, via kokoro-onnx (no torch)
    model_path: models/kokoro-v1.0.onnx # https://github.com/thewh1teagle/kokoro-onnx/releases
    voices_path: models/voices-v1.0.bin
    voice: af_heart
    lang: en-us # no built-in Australian English voice; en-us/en-gb are closest
  piper: # Arabic voice - GPL-3.0-or-later, see README "Licensing"
    model_path: models/ar_JO-kareem-medium.onnx # https://huggingface.co/rhasspy/piper-voices - pick any ar_* voice
    config_path: null # defaults to "<model_path>.json" if null

logging:
  level: INFO
  structured: true # true = JSON lines, false = human-readable console format
  latency_metrics: true
