name: Build Linux Desktop App

# Packages engine/ (server + web client) into a native Linux binary via
# PyInstaller, built on an actual ubuntu-latest runner - same
# desktop_launcher.spec as the Windows build (see build-windows.yml),
# PyInstaller just doesn't cross-compile so each OS needs its own runner.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-english-speech-translation-72v8pb
    paths:
      - "engine/**"
      - ".github/workflows/build-linux.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system audio deps
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 espeak-ng

      - name: Free disk space
        # ubuntu-latest ships several GB of preinstalled SDKs we don't use
        # (.NET, Android, GHC) - free it before a heavy ML dependency install.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: Install CPU-only PyTorch
        # silero-vad's own dependency metadata requires torch/torchaudio,
        # even though this project only ever uses its ONNX runtime export
        # (never torch/GPU) - pip's default Linux wheel for torch pulls in
        # the *entire* CUDA toolkit as separate multi-GB nvidia-* packages,
        # which is what actually exhausted the runner's disk here. Installing
        # the small CPU-only build first satisfies silero-vad's version
        # bounds without pip ever reaching for the CUDA variant.
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller desktop_launcher.spec

      - name: Copy top-level docs into the bundle
        run: |
          cp ../README.md dist/Interpreter/README.md
          cp ../.env.example dist/Interpreter/.env.example

      - name: Make the binary executable
        run: chmod +x dist/Interpreter/Interpreter

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: interpreter-linux
          path: engine/dist/Interpreter/
          retention-days: 30
          if-no-files-found: error
