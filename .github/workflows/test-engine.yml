name: Test Engine

# The Python test suite plus both real-browser end-to-end checks (web client,
# and the meeting-bot path against a fake Attendee) - the same commands run
# during development, on a clean runner.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-english-speech-translation-72v8pb
    paths:
      - "engine/**"
      - "config.yaml"
      - "glossary.yaml"
      - ".github/workflows/test-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y espeak-ng libportaudio2

      - name: Install Python deps
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: pytest
        run: python -m pytest -q

      - name: Web client end-to-end (real Chromium)
        run: python -m scripts.verify_web_client --chromium-path "$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"

      - name: Meeting bot end-to-end (real Chromium, fake Attendee)
        run: python -m scripts.verify_meeting_bot --chromium-path "$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
