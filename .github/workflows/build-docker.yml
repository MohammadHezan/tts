name: Build Translator Docker Image

# Builds the translator image from the repo-root Dockerfile and smoke-tests it:
# the container starts, serves the meeting-bot dashboard, and answers the
# /api/bots/config probe. Uses fake providers for the running check so it
# doesn't need the Whisper/voice model downloads - the real shipped config
# (deploy/config.docker.yaml) is still loaded and validated separately.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-english-speech-translation-72v8pb
    paths:
      - "engine/**"
      - "deploy/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "config.yaml"
      - "glossary.yaml"
      - ".github/workflows/build-docker.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build translator image
        run: docker build -t interpreter-translator .

      - name: Shipped docker config parses
        run: >
          docker run --rm interpreter-translator python -c
          "from app.config import load_config; c = load_config();
          assert c.translator.ollama.base_url == 'http://ollama:11434', c.translator.ollama.base_url;
          assert c.tts.provider == 'multi_voice';
          print('asr', c.asr.model, c.asr.device, '| translator', c.translator.provider, '| tts', c.tts.provider)"

      - name: Smoke test - server starts and serves the dashboard
        run: |
          cat > /tmp/config.fake.yaml <<'EOF'
          audio: {sample_rate_hz: 16000, frame_ms: 30, channels: 1}
          vad: {provider: silero, threshold: 0.5, min_speech_ms: 150, min_silence_ms: 700, speech_pad_ms: 200}
          asr: {provider: fake}
          translator: {provider: fake, glossary_path: null}
          tts: {provider: fake}
          EOF
          docker run -d --name smoke -p 8765:8000 \
            -v /tmp/config.fake.yaml:/srv/tts/deploy/config.fake.yaml:ro \
            -e ENGINE_CONFIG_PATH=/srv/tts/deploy/config.fake.yaml \
            interpreter-translator
          for i in $(seq 1 30); do curl -fsS http://localhost:8765/healthz && break; sleep 2; done
          curl -fsS http://localhost:8765/bot.html | grep -q "Meeting Interpreter"
          curl -fsS http://localhost:8765/api/bots/config | tee /dev/stderr | grep -q '"attendee_configured":false'

      - name: Container logs
        if: always()
        run: docker logs smoke || true
