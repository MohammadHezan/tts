name: Build Android APK

# Builds android/app on a GitHub-hosted runner, which has unrestricted
# internet (dl.google.com etc.) - unlike the sandbox this repo was originally
# built in, where only android/core (pure Kotlin) could be built/tested.
# See android/README.md for that split's full explanation.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-english-speech-translation-72v8pb
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the APK to the android-latest pre-release (step below)
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: interpreter-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # Artifacts need a GitHub login and come zipped - awkward on a phone. A
      # pre-release asset is one tap: open the link on the phone, install.
      - name: Publish to the android-latest pre-release (direct phone download)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Interpreter-debug.apk
          NOTES="Debug build of the Android app from commit ${GITHUB_SHA} (run ${GITHUB_RUN_ID}). Open this page on the phone, tap Interpreter-debug.apk, install. Replaced on every build."
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --prerelease --target "$GITHUB_SHA" \
              --title "Android app - latest build" --notes "$NOTES"
          fi
          gh release upload android-latest Interpreter-debug.apk --clobber
          gh release edit android-latest --notes "$NOTES"
