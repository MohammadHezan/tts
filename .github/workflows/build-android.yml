name: Build Android APK

# Builds android/app on a GitHub-hosted runner, which has unrestricted
# internet (dl.google.com etc.) - unlike the sandbox this repo was originally
# built in, where only android/core (pure Kotlin) could be built/tested.
# See android/README.md for that split's full explanation.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-english-speech-translation-72v8pb
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: interpreter-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
