# The one-click meeting interpreter (docker-compose.yml + start scripts):
#   1. builds the translator image and Attendee's (from its tagged release) and
#      publishes both to GHCR, so a user's first start downloads instead of builds
#   2. quick checks: the GPU image's CUDA libraries load, docker-compose.gpu.yml
#      merges, deploy/start.ps1 parses in Windows PowerShell 5.1
#   3. publishes Interpreter-PC.zip and Interpreter-Windows.zip to pc-latest
name: One-Click Stack

on:
  workflow_dispatch:
  push:
    branches: [claude/arabic-english-speech-translation-72v8pb]
    paths:
      - "engine/**"
      - "deploy/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.gpu.yml"
      - "start.sh"
      - "stop.sh"
      - "*.bat"
      - "config.yaml"
      - "glossary.yaml"
      - ".github/workflows/one-click-stack.yml"

concurrency:
  group: one-click-stack-${{ github.ref }}
  cancel-in-progress: true

env:
  TRANSLATOR_IMAGE: ghcr.io/mohammadhezan/interpreter-translator
  ATTENDEE_IMAGE: ghcr.io/mohammadhezan/interpreter-attendee
  ATTENDEE_VERSION: "1.79.2" # keep in step with docker-compose.yml

jobs:
  translator-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.TRANSLATOR_IMAGE }}:latest
            ${{ env.TRANSLATOR_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=translator
          cache-to: type=gha,mode=max,scope=translator

  translator-gpu-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (CUDA libraries + Whisper large-v3-turbo)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VARIANT=gpu
            WHISPER_MODEL=large-v3-turbo
          push: true
          tags: |
            ${{ env.TRANSLATOR_IMAGE }}:gpu
            ${{ env.TRANSLATOR_IMAGE }}:gpu-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=translator-gpu
          cache-to: type=gha,mode=max,scope=translator-gpu
      - name: The GPU image is complete (no GPU here, so everything short of running on one)
        run: |
          docker run --rm "$TRANSLATOR_IMAGE:gpu" python - <<'EOF'
          import ctypes
          # What CTranslate2 loads the moment Whisper runs on CUDA.
          for lib in ("libcublas.so.12", "libcublasLt.so.12", "libcudnn.so.9", "libcudnn_ops.so.9", "libcudnn_cnn.so.9"):
              ctypes.CDLL(lib)
              print("loads:", lib)
          import ctranslate2
          print("ctranslate2", ctranslate2.__version__, "- CUDA devices here:", ctranslate2.get_cuda_device_count())
          from faster_whisper import download_model
          print("large-v3-turbo baked in at", download_model("large-v3-turbo", local_files_only=True))
          import os
          os.environ["ENGINE_CONFIG_PATH"] = "/srv/tts/deploy/config.docker-gpu.yaml"
          from app.config import load_config
          c = load_config()
          assert (c.asr.model, c.asr.device, c.asr.cpu_fallback_model) == ("large-v3-turbo", "cuda", "small"), c.asr
          print("config:", c.asr.model, c.asr.device, c.asr.compute_type, "| vad:", c.vad)
          EOF
      - name: docker-compose.gpu.yml merges cleanly
        run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet

  attendee-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Already published?
        id: exists
        run: |
          if docker manifest inspect "$ATTENDEE_IMAGE:$ATTENDEE_VERSION" >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; echo "$ATTENDEE_IMAGE:$ATTENDEE_VERSION already published"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space
        if: steps.exists.outputs.yes == 'false'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.yes == 'false'
      - name: Build Attendee v${{ env.ATTENDEE_VERSION }} unmodified and publish it
        if: steps.exists.outputs.yes == 'false'
        # Attendee's Dockerfile runs a dozen apt-get updates against Ubuntu's
        # mirrors, which fail now and then mid-sync ("File has unexpected
        # size ... Mirror sync in progress?"). Layers that did build stay in
        # the builder's cache, so a retry resumes at the step that failed.
        run: |
          for attempt in 1 2 3 4; do
            if docker buildx build --push \
                --tag "$ATTENDEE_IMAGE:$ATTENDEE_VERSION" \
                --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
                --label "org.opencontainers.image.description=Attendee v$ATTENDEE_VERSION (github.com/attendee-labs/attendee, Elastic License 2.0), built unmodified for the Meeting Interpreter" \
                "https://github.com/attendee-labs/attendee.git#v$ATTENDEE_VERSION"; then
              exit 0
            fi
            echo "::warning::Attendee image build attempt $attempt failed; retrying in $((attempt * 90))s"
            sleep $((attempt * 90))
          done
          exit 1

  windows-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy/start.ps1 parses in Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\deploy\start.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
          $PSVersionTable.PSVersion
          Write-Host "start.ps1 parses"

  package:
    needs: [translator-image, translator-gpu-image, attendee-image, windows-script]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the pc-latest pre-release
    steps:
      - uses: actions/checkout@v4
      - name: Build Interpreter-PC.zip (Linux/Mac) and Interpreter-Windows.zip
        run: |
          # The stack, the start/stop scripts, and the translator's source (so
          # docker compose can still build it if the image can't be pulled).
          git archive --format=zip --prefix=Interpreter-PC/ -o Interpreter-PC.zip HEAD -- . ':!android' ':!.github'
          mkdir -p Interpreter-PC && cp deploy/README-PC.txt Interpreter-PC/README.txt
          zip -q Interpreter-PC.zip Interpreter-PC/README.txt
          unzip -l Interpreter-PC.zip | tail -1

          # Windows: only what a person clicks at the top; everything else in
          # app\ (the .bat files find it there - see "Start Interpreter.bat").
          mkdir -p win
          git archive --format=tar --prefix=Interpreter/app/ HEAD -- . ':!android' ':!.github' | tar -x -C win
          mv "win/Interpreter/app/Start Interpreter.bat" "win/Interpreter/app/Stop Interpreter.bat" win/Interpreter/
          cp deploy/README-Windows.txt win/Interpreter/README.txt
          (cd win && zip -qr ../Interpreter-Windows.zip Interpreter)
          unzip -l Interpreter-Windows.zip | awk 'NR > 3 && $4 !~ /\/app\/./ {print $4}'
      - name: Publish to the pc-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Meeting Interpreter for your computer, from commit ${GITHUB_SHA} (run ${GITHUB_RUN_ID}). Windows: download Interpreter-Windows.zip, unzip, double-click \"Start Interpreter\". Linux/Mac: download Interpreter-PC.zip, unzip, run ./start.sh. Needs Docker. Replaced on every build."
          if ! gh release view pc-latest >/dev/null 2>&1; then
            gh release create pc-latest --prerelease --target "$GITHUB_SHA" --title "Meeting Interpreter for your computer - latest" --notes "$NOTES"
          fi
          gh release upload pc-latest Interpreter-PC.zip Interpreter-Windows.zip --clobber
          gh release edit pc-latest --notes "$NOTES"
