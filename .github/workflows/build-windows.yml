name: Build Windows Desktop App

# Packages engine/ (server + web client) into a double-click .exe via
# PyInstaller, built on an actual windows-latest runner since PyInstaller
# does not cross-compile - see engine/desktop_launcher.spec. The Linux
# equivalent (build-linux.yml) builds from this exact same spec file.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-english-speech-translation-72v8pb
    paths:
      - "engine/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch
        # silero-vad's own dependency metadata requires torch/torchaudio,
        # even though this project only ever uses its ONNX runtime export
        # (never torch/GPU) - pinning the small CPU-only build here keeps
        # this deterministic instead of relying on whatever pip's default
        # wheel selection happens to be (see build-linux.yml for why this
        # matters there: the default Linux wheel pulls in several GB of
        # unused CUDA packages and exhausted that runner's disk).
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller desktop_launcher.spec

      - name: Copy top-level docs into the bundle
        run: |
          copy ..\README.md dist\Interpreter\README.md
          copy ..\.env.example dist\Interpreter\.env.example

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: interpreter-windows
          path: engine/dist/Interpreter/
          retention-days: 30
          if-no-files-found: error
