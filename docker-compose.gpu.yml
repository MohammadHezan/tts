# NVIDIA GPU mode, added on top of docker-compose.yml. The start scripts turn
# it on by themselves when Docker can use an NVIDIA GPU (they test with
# `docker run --gpus all ... nvidia-smi`), so there's normally nothing to do.
# By hand:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Speech recognition is Cohere Transcribe Arabic (a dialect fine-tune, ~4GB,
# downloaded once by asr-pull) - far better at Jordanian Arabic than any
# Whisper - and the translation model - Gemma 3 12B here, better Arabic
# than the CPU's Llama 3.1 8B, ~7GB more to download once - answers in about a
# second instead of several. Needs a current NVIDIA driver plus GPU support in Docker: on
# Windows, Docker Desktop with the WSL 2 backend; on Linux, the NVIDIA Container
# Toolkit. Set INTERPRETER_CPU=1 before starting to stay on the CPU anyway.
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  translator:
    <<: *gpu
    image: ghcr.io/mohammadhezan/interpreter-translator:gpu
    build:
      context: .
      args:
        VARIANT: gpu
        WHISPER_MODEL: small # for the CPU fallback; large-v3-turbo downloads only if ever needed
    environment:
      ENGINE_CONFIG_PATH: /srv/tts/deploy/config.docker-gpu.yaml
    volumes:
      - interpreter-asr:/models/asr
    depends_on:
      asr-pull:
        condition: service_completed_successfully

  asr-pull:
    image: ghcr.io/mohammadhezan/interpreter-translator:gpu
    environment:
      ENGINE_CONFIG_PATH: /srv/tts/deploy/config.docker-gpu.yaml
    command: ["python", "/srv/tts/deploy/download_asr.py"]
    volumes:
      - interpreter-asr:/models/asr
    restart: "no"

  ollama:
    <<: *gpu
    environment:
      # Halve the memory for the model's context (flash attention, 8-bit
      # cache), so Gemma 3 12B and Whisper both fit a 12GB card.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0

  ollama-pull:
    entrypoint: ["ollama", "pull", "hf.co/unsloth/gemma-3-12b-it-GGUF:IQ4_XS"]

volumes:
  interpreter-asr:
