# Optional: run the translation model on an NVIDIA GPU (e.g. an RTX 3060).
# Translation is by far the slowest step on CPU - on a GPU the 8B model
# answers in about a second instead of many.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Needs a current NVIDIA driver plus GPU support in Docker: on Windows,
# Docker Desktop with the WSL 2 backend; on Linux, the NVIDIA Container
# Toolkit. Check with: docker run --rm --gpus all ubuntu nvidia-smi
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
