# Domain glossary: exact preferred EN<->AR translations for brand/product/retail
# terms, injected into the translator's system prompt (see engine/app/glossary.py)
# so the LLM stays consistent instead of inventing ad-hoc phrasing turn to turn.
#
# Edit freely for your own brand names, collection names, campaign hashtags, and
# retail jargon. Each entry must have both "en" and "ar" - the translator picks
# the right direction automatically based on the turn being translated.

terms:
  - en: "showroom"
    ar: "صالة العرض"
  - en: "Chesterfield sofa"
    ar: "أريكة تشيسترفيلد"
  - en: "Instagram Reels"
    ar: "ريلز إنستغرام"
  - en: "collection"
    ar: "مجموعة"
  - en: "invoice"
    ar: "فاتورة"
  - en: "shipment"
    ar: "شحنة"
  # Materials and pieces - a small model mixes these up otherwise (it rendered
  # "walnut wood" as cedar, خشب الأرز, in the meeting simulation).
  - en: "walnut"
    ar: "خشب الجوز"
  - en: "oak"
    ar: "خشب البلوط"
  - en: "cedar"
    ar: "خشب الأرز"
  - en: "teak"
    ar: "خشب الساج"
  - en: "marble"
    ar: "رخام"
  - en: "velvet"
    ar: "مخمل"
  - en: "leather"
    ar: "جلد طبيعي"
  - en: "sofa"
    ar: "أريكة"
  - en: "dining table"
    ar: "طاولة طعام"
  - en: "dining chairs"
    ar: "كراسي طعام"
